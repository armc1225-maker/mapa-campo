name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Herramienta para íconos
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Preparar la app web
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          node build-www.js

      - name: Crear el proyecto Android
        working-directory: android-app
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Compilar la APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MapaDeCampo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MapaDeCampo-apk
          path: MapaDeCampo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mapa de Campo 1.${{ github.run_number }}
          make_latest: true
          body: |
            APK para Android. Descárgala desde el teléfono, ábrela y permite "instalar apps de origen desconocido" si lo pide.
            Enlace fijo a la última versión: https://github.com/${{ github.repository }}/releases/latest/download/MapaDeCampo.apk
          files: MapaDeCampo.apk
