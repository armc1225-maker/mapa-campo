<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Campo</title>
<meta name="description" content="Mapas PDF georreferenciados sin internet: ubicación GPS, puntos con fotos, tracks, áreas y exportación KML, GPX y CSV.">
<meta name="theme-color" content="#1f5135">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2efe7; --card:#fffdf8; --ink:#17231b; --muted:#5b6a5f; --line:#d6d0c0;
  --accent:#1f5135; --accent-ink:#fff; --soft:#e2ebdc; --rec:#c2361f; --warn:#8a4b00;
  --gps:#1a73e8; --bar:rgba(255,253,248,.96); --shadow:0 4px 18px rgba(0,0,0,.18);
  --map:#d9d6cc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111712; --card:#1a231d; --ink:#e6ece6; --muted:#9db0a2; --line:#2f3c33;
    --accent:#7cc495; --accent-ink:#0b1a10; --soft:#22322a; --rec:#ff7a63; --warn:#e8ad5e;
    --gps:#6aa8ff; --bar:rgba(26,35,29,.96); --shadow:0 4px 18px rgba(0,0,0,.5); --map:#232a25;
  }
}
:root[data-theme="dark"]{
  --bg:#111712; --card:#1a231d; --ink:#e6ece6; --muted:#9db0a2; --line:#2f3c33;
  --accent:#7cc495; --accent-ink:#0b1a10; --soft:#22322a; --rec:#ff7a63; --warn:#e8ad5e;
  --gps:#6aa8ff; --bar:rgba(26,35,29,.96); --shadow:0 4px 18px rgba(0,0,0,.5); --map:#232a25;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen{display:none;height:100dvh}
.screen.on{display:flex;flex-direction:column}

/* Biblioteca */
#lib header{padding:calc(16px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
#lib header img{width:40px;height:40px}
#lib h1{font-size:1.35rem;margin:0}
#lib header p{margin:0;color:var(--muted);font-size:.85rem}
#lib main{flex:1;overflow:auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.mapcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.mapcard img{width:76px;height:76px;object-fit:cover;border-radius:9px;background:var(--map);flex:none}
.mapcard b{display:block;font-size:1rem;overflow-wrap:anywhere}
.mapcard small{display:block;color:var(--muted);font-size:.8rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:4px}
.tag.ok{background:var(--soft);color:var(--accent)}
.tag.no{background:#f5e3c8;color:#7a4300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.no{background:#3a2c18;color:var(--warn)}}
.empty{max-width:520px;margin:40px auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.1rem}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:15px 22px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}

/* Vista de mapa */
#view{position:relative;background:var(--map)}
#leaf,#leafGeo{position:absolute;inset:0;background:var(--map)}
.geoimg{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;max-width:none!important;image-rendering:auto}
.leaflet-bottom{bottom:calc(78px + env(safe-area-inset-bottom))}
.leaflet-control-attribution{font-size:10px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.basethumb{width:76px;height:76px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#2d5a3a,#6b7f3a 45%,#3a6e8f)}
.basethumb svg{width:34px;height:34px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:36px}
.leaflet-container{background:var(--map);font:inherit}
.topbar{position:absolute;z-index:1000;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.topbar>*{pointer-events:auto}
.ib{width:48px;height:48px;border-radius:14px;border:0;background:var(--bar);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.ib.on{background:var(--gps);color:#fff}
.readout{flex:1;min-width:0;background:var(--bar);box-shadow:var(--shadow);border-radius:14px;padding:6px 12px;min-height:48px}
.readout .t{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .c{font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .s{font-size:.75rem;color:var(--muted)}
.readout .s.w{color:var(--warn);font-weight:700}
.banner{position:absolute;z-index:1000;left:8px;right:8px;top:calc(68px + env(safe-area-inset-top));background:var(--bar);box-shadow:var(--shadow);border-radius:12px;padding:10px 12px;font-size:.9rem;display:none;gap:10px;align-items:center}
.banner.on{display:flex}
.banner button{margin-left:auto}
.cross{position:absolute;z-index:900;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;display:none;color:var(--ink)}
.cross.on{display:block}
.cross svg{width:44px;height:44px;stroke:currentColor;stroke-width:2;fill:none;filter:drop-shadow(0 0 2px var(--card)) drop-shadow(0 0 1px var(--card))}
.bottom{position:absolute;z-index:1000;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.bottom>*{pointer-events:auto}
.tools{display:flex;gap:6px;background:var(--bar);box-shadow:var(--shadow);border-radius:18px;padding:6px;max-width:620px;margin:0 auto}
.tools button{flex:1;min-width:0;border:0;background:transparent;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;cursor:pointer}
.tools button:active{background:var(--soft)}
.tools button[disabled]{opacity:.35}
.panel{background:var(--bar);box-shadow:var(--shadow);border-radius:18px;padding:12px;max-width:620px;margin:0 auto}
.panel .info{font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:4px}
.panel .sub{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 30%}
.btn{border:0;border-radius:12px;padding:13px 12px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.rec{background:var(--rec);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

/* Hojas */
.veil{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:1.1rem;margin:0 0 12px}
.sheet h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:10px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 0 1px var(--line)}
.swatches button[aria-pressed=true]{border-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;background:var(--bg);border-radius:12px;padding:10px 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos img,.photos .add{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.photos .add{border:2px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list button{display:flex;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 2px;text-align:left;cursor:pointer;width:100%}
.list button:last-child{border-bottom:0}
.list .sw{width:14px;height:14px;border-radius:4px;flex:none}
.list b{display:block;font-weight:600}
.list small{color:var(--muted);font-size:.8rem}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:14px 4px;font-weight:600;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:11px 4px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.85rem;color:var(--muted);margin:6px 0 12px}
.gcp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.gcp .n{width:26px;height:26px;border-radius:50%;background:#7b2cbf;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.gcp button{margin-left:auto}
.viewer{position:fixed;inset:0;z-index:4000;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .row{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
#toast{position:fixed;z-index:5000;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b241e;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.45);display:none;place-items:center;color:#fff;font-weight:700;text-align:center;padding:16px}
#busy.on{display:grid}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lbl{background:var(--bar);color:var(--ink);border:0;box-shadow:0 1px 4px rgba(0,0,0,.3);font-weight:600;font-size:.75rem;padding:2px 6px}
.lbl::before{display:none}
.gcpicon{background:#7b2cbf;color:#fff;border:2px solid #fff;border-radius:50%;display:grid!important;place-items:center;font-weight:700;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vtx{background:#fff;border:3px solid var(--ink);border-radius:50%}
</style>
</head>
<body>

<section id="lib" class="screen on" aria-label="Biblioteca de mapas">
  <header>
    <img src="icon.svg" alt="">
    <div><h1>Mapa de Campo</h1><p>Mapas georreferenciados sin internet</p></div>
  </header>
  <main><div id="maps" class="maps"></div></main>
  <button class="fab" id="btnImport"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Importar mapa o capa</button>
  <input type="file" id="fileMap" accept="application/pdf,.pdf,image/*,.kml,.kmz,.gpx,.geojson,.json,.zip,.shp,.dbf,.prj,.cpg,.shx,.csv,.txt" multiple hidden>
</section>

<section id="view" class="screen" aria-label="Mapa">
  <div id="leaf"></div>
  <div id="leafGeo" hidden></div>
  <div class="cross" id="cross"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="7"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12"/></svg></div>
  <div class="topbar">
    <button class="ib" id="btnBack" aria-label="Volver a la biblioteca"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="readout" aria-live="polite">
      <div class="t" id="mapName"></div>
      <div class="c" id="gpsCoord">Buscando GPS…</div>
      <div class="s" id="gpsInfo"></div>
    </div>
    <button class="ib" id="btnMenu" aria-label="Menú del mapa"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="bottom" id="bottom"></div>
  <input type="file" id="fileLayer" accept=".kml,.kmz,.gpx,.geojson,.json,.zip,.shp,.dbf,.prj,.cpg,.shx,.csv,.txt" multiple hidden>
</section>

<div id="toast" role="status"></div>
<div id="busy"><div><div class="spin"></div><div id="busyMsg">Procesando…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="geo.js"></script>
<script src="formats.js"></script>
<script src="app.js"></script>
</body>
</html>
